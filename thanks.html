<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>پیام ارسال شد</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            font-family: sans-serif;
        }
        .thanks-box {
            padding: 40px;
            border: 2px solid #ff8c00;
            border-radius: 15px;
        }
        .thanks-box h1 {
            color: #ff8c00;
        }
        .thanks-box a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: #ff8c00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="thanks-box">
        <h1>✅ پیام شما با موفقیت ارسال شد</h1>
        <p>ممنون از وقتی که گذاشتید، به زودی پاسخ می‌دهیم.</p>
        <a href="index.html">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
