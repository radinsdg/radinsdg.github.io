<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="192x192" href="radinsdg-192.png">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login Page</title>
</head>
<body>
    <div class="container">
        <h1>ورود حساب</h1>
        <form>
            <label for="fname">نام</label>
            <input type="text" id="fname" placeholder="رادین" required>
            <label for="lname">نام خانوادگی</label>
            <input type="text" id="lname" placeholder="سرلک" required>
            <label for="id">شناسه شما</label>
            <input type="text" id="id" placeholder="radin.s42" required>
            <label for="email">ایمیل</label>
            <input type="email" id="email" placeholder="radin.s1234@sample.com" required>
            <label for="password">رمز ورود</label>
            <input type="password" id="password" placeholder="••••••••••" required>
            <h4 id="message"></h4>
            <button id="login-btn" onclick="login()">ورود حساب</button>
        </form>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
